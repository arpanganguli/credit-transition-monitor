[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-transition-monitor"
version = "0.1.0"
description = "Private credit early-warning and covenant monitoring engine"
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "pandas",
]

[tool.setuptools.packages.find]
where = ["src"]