[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "credit-transition-monitor"
version = "0.1.0"
description = "Explainable private-credit monitoring prototype"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "streamlit>=1.50,<2", "plotly>=5.24,<8", "openpyxl>=3.1,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
